# Butterfly Theme Configuration
# Docs: https://butterfly.js.org/

# 导航菜单
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  列表||fas fa-list:
    音乐: /music/ || fas fa-music
    电影: /movies/ || fas fa-video
  友链: /links/ || fas fa-link
  关于: /about/ || fas fa-heart

# 代码块配置
code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: darker
  macStyle: true
  height_limit: 300
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 计算机硕士研究生<br>后端开发 & AI应用研发
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/ylcmy
  card_announcement:
    enable: true
    content: 欢迎来到我的个人主页，这里记录我的学习笔记和日常思考。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
    sort_order:

# 浏览器标签页图标
favicon: /img/favicon.jpg

# 首页副标题打字效果
subtitle:
  enable: true
  effect: true # 开启打字机动画
  # 第三方API（选一个，或设为 false 用自定义文字）
  # 1 = 一言 (hitokoto.cn)
  # 2 = 一言 (aa1.cn)
  # 3 = 今日诗词 (jinrishici.com)
  source: 1

activate_power_mode:
  enable: true
  colorful: true # 开启粒子动画（发光特效）
  shake: true # 开启 shake（抖动特效）
  mobile: false

# 首页顶部样式
index_img: /img/default.jpg
disable_top_img: false

default_top_img: /img/default.jpg

nav:
  logo: /img/logo.jpg

# 头像（侧边栏）
avatar:
  img: /img/avatar.jpg
  effect: false

# 文章封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover:
    - /img/cover1.png
    - /img/cover2.png

# 社交图标
social:
  fab fa-github: https://github.com/ylcmy || Github || '#24292e'
  fas fa-envelope: mailto:2934773988@qq.com || Email || '#4a7dbe'

# 文章页配置
post_meta:
  page:
    date_type: updated
    date_format: relative
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    date_format: relative
    categories: true
    tags: true
    label: true

# 相关文章
related_post:
  enable: true
  limit: 6 # 显示的文章数量
  date_type: created

# 文章版权
post_copyright:
  enable: true
  decode: true
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 目录
toc:
  post: true
  page: true
  number: false
  expand: false
  style_simple: false
  scroll_percent: true

# 数学公式（KaTeX）
katex:
  enable: true
  per_page: true
  hide_scrollbar: false

# 评论系统 - Giscus（基于 GitHub Discussions，无需后端，国内可访问）
comments:
  use: Giscus
  count: true
  card_post_count: false

# Twikoo 配置（已注释，备用）
# twikoo:
#   envId: https://my-twikoo-sigma-drab.vercel.app
#   region:
#   visitor: true
#   option:

# Giscus 配置
# 需要在 https://giscus.app/ 生成配置，填入 repo、repo_id、category_id
giscus:
  repo: ylcmy/ylcmy.github.io
  repo_id: MDEwOlJlcG9zaXRvcnkzMjIwMDIxMTI=
  category_id: DIC_kwDOEzFcwM4C8cI7
  light_theme: light
  dark_theme: dark
  js:
  option:

# 暗色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  custom_text: |
    <div style="text-align:center; padding:10px 0;">
      <p style="margin:5px 0; font-size:0.9em; color:#555;">
        <i class="fas fa-heart" style="color:#e74c3c; margin:0 5px;"></i>
        用代码编织梦想，用文字记录成长
        <i class="fas fa-heart" style="color:#e74c3c; margin:0 5px;"></i>
      </p>
      <p id="runtime" style="margin:8px 0; font-size:0.85em; color:#666;"></p>
      <p style="margin:5px 0; font-size:0.8em; color:#888;">
        Powered by <a href="https://hexo.io/" target="_blank" style="color:#667eea; text-decoration:none;">Hexo</a> &
        <a href="https://butterfly.js.org/" target="_blank" style="color:#667eea; text-decoration:none;">Butterfly</a>
      </p>
    </div>
  copyright: true
  framework:
    enable: true
    name: Butterfly
    version: true

# 页脚背景
footer_img: false

# 美化页面
beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: "#F47466"

# 加载动画
preloader:
  enable: true
  source: 1 # 1=全屏动画, 2=进度条

# 进入动画
enter_transitions:
  enable: true

# 字体美化
font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: '"LXGW WenKai", "Noto Sans SC", sans-serif'
  code_font_family: '"Fira Code", "JetBrains Mono", monospace'

# 博客标题字体
blog_title_font:
  font_link: https://fonts.googleapis.com/css2?family=LXGW+WenKai&display=swap
  font_family: '"LXGW WenKai", cursive'

# 图片懒加载
lazyload:
  enable: true
  native: false # true=浏览器原生懒加载, false=vanilla-lazyload（兼容性更好）
  field: site # site=全站, post=仅文章页
  placeholder: # 加载占位图（留空则显示模糊缩略图）
  blur: false # true=模糊过渡效果

# 图片放大查看（灯箱效果）
# fancybox: 功能丰富，支持缩放、幻灯片
# medium_zoom: 轻量级，简洁放大
lightbox: fancybox

# 搜索
search:
  use: local_search  # 指定搜索引擎
  placeholder: 搜索文章...
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false

# 文章字数统计
wordcount:
  enable: true
  post_wordcount: true # 文章页显示字数
  min2read: true # 显示阅读时间
  total_wordcount: true # 侧边栏显示全站总字数

# 网站访问人数统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 在返回顶部按钮中显示滚动百分比
rightside_scroll_percent: true

# hexo-butterfly-categories-card 首页分类磁贴
# see https://akilar.top/posts/a9131002/
categoryBar:
  enable: false # 开关
  priority: 5 # 过滤器优先权
  enable_page: / # 应用页面（首页）
  layout: # 挂载容器类型
    type: id
    name: recent-posts
    index: 0
  column: odd # odd：3列 | even：4列
  row: 1 # 显示行数，超过行数切换为滚动显示
  message:
    - descr: "日常"
      # cover: /img/default.jpg
    - descr: "后端开发"
      # cover: /img/default.jpg
    - descr: "AI应用研发"
      # cover: /img/default.jpg
  custom_css: https://npm.elemecdn.com/hexo-butterfly-categories-card/lib/categorybar.css

# 自定义注入
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    - <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  bottom:
    - <script src="/js/runtime.js"></script>
